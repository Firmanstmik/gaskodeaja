server {
    listen 80;
    server_name gaskodeaja.com www.gaskodeaja.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gaskodeaja.com www.gaskodeaja.com;

    ssl_certificate /etc/letsencrypt/live/gaskodeaja.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gaskodeaja.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 55M;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Laravel API — semua request /api/* ke index.php
    location ^~ /api {
        fastcgi_pass unix:/run/php/php8.4-fpm.sock;
        fastcgi_param SCRIPT_FILENAME /var/www/gaskodeaja/GasKodeWeb/public/index.php;
        include fastcgi_params;
        fastcgi_param REQUEST_URI $request_uri;
    }

    # Laravel storage & uploads
    location ^~ /storage/ {
        alias /var/www/gaskodeaja/GasKodeWeb/storage/app/public/;
        expires 30d;
        access_log off;
    }

    location ^~ /uploads/ {
        alias /var/www/gaskodeaja/GasKodeWeb/public/uploads/;
        expires 30d;
        access_log off;
    }

    # Next.js frontend
    location / {
        proxy_pass http://127.0.0.1:3025;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
